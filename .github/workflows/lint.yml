name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (ruff + black + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
          pip install -r chatbot/requirements.txt

      - name: ruff
        run: ruff check chatbot scripts tests samples

      - name: black --check
        run: black --check chatbot scripts tests samples

      - name: mypy
        run: mypy --ignore-missing-imports chatbot

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chatbot/requirements.txt

      # Needs no BookStack, LLM or Docker; integration tests skip
      - name: pytest
        run: pytest -q

  images:
    name: Compose images exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that was never published (bookstack:25.07, mariadb:11.5) made
      # "docker compose up" fail at the first pull, for every new installation.
      - name: Every image tag in the compose file resolves
        run: |
          images=$(grep -E '^[[:space:]]+image:' \
            docker/docker-compose.yml | awk '{print $2}')
          test -n "$images"
          for image in $images; do
            echo "checking $image"
            docker manifest inspect "$image" > /dev/null
          done

  yaml:
    name: YAML (yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -d relaxed .
