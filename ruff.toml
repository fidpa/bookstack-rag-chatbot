# Pins the rule set this repository was linted against.
#
# lint.yml installs Ruff unpinned, so without this file every new Ruff default
# rule set changes the gate without a commit: Ruff 0.16 reports 653 findings on
# the same tree that passes under the selection below.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
