# Reverse proxy in front of BookStack and the chatbot, on one origin.
#
# The embedded widget posts to /chat/api/ on the page's own origin, so both
# services must be reachable under the same scheme, host and port. Run the
# chatbot with TRUSTED_PROXY_HOPS=1 behind this proxy, and do not publish port
# 8888 to clients: the allow-list and the rate limit trust the address this
# proxy reports.

server {
    listen 80;
    server_name _;

    # Chatbot widget API
    location /chat/api/ {
        proxy_pass http://chatbot:8888;
        proxy_set_header Host $host;
        # Replace, do not append: $remote_addr is the only address this proxy
        # can vouch for. The chatbot reads the rightmost entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Answers from the LLM can take a while
        proxy_read_timeout 180;
        client_max_body_size 1M;
    }

    # BookStack
    location / {
        proxy_pass http://bookstack:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;

        # Buffer settings
        client_max_body_size 50M;
        proxy_buffering off;
    }
}
